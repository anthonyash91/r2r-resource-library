# Render Blueprint — https://render.com/docs/blueprint-spec
#
# CRITICAL: Next.js standalone reads process.env.HOSTNAME for the listen address.
# Render sets HOSTNAME to the container name by default, so the app binds there
# instead of 0.0.0.0 and Render's port scanner fails with:
#   "No open HTTP ports detected on 0.0.0.0"
# The startCommand below forces HOSTNAME=0.0.0.0 for the Node process.

services:
  - type: web
    name: r2r-resource-library
    runtime: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: bash scripts/render-build.sh
    startCommand: HOSTNAME=0.0.0.0 node .next/standalone/server.js
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: PORT
        value: "10000"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=768"
      # Do NOT set HOSTNAME here — use startCommand prefix only.
      # Do NOT set NODE_ENV=production here — skips Tailwind postcss at build.
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FACILITY_CRYPTO_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: DEEPL_API_KEY
        sync: false
